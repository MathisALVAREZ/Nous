services:
  nous:
    build: .
    container_name: nous
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3080:3000"   # joignable uniquement par Nginx sur le VPS
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
