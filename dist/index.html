:root {
  /* Nous — verre liquide : panneaux translucides sur un fond de lumière diffuse ; colonne unique mobile, barre d'onglets en capsule flottante */
  --bg: #e8edfb;
  --ink: #0b1220;
  --ink2: rgba(11, 18, 32, .64);
  --ink3: rgba(11, 18, 32, .40);
  --glass: rgba(255, 255, 255, .44);
  --glass2: rgba(255, 255, 255, .70);
  --field: rgba(255, 255, 255, .55);
  --edge: rgba(255, 255, 255, .78);
  --spec: rgba(255, 255, 255, .85);
  --hair: rgba(11, 18, 32, .09);
  --accent: #0a7aff;
  --u0: #0a7aff;
  --u1: #ff2d6f;
  --good: #14994d;
  --warn: #d97a00;
  --bad: #e0323a;
  --blob1: #86c2ff;
  --blob2: #ffa9cc;
  --blob3: #c4b0ff;
  --blob4: #ffdc9c;
  --shadow: 0 10px 36px rgba(40, 60, 120, .13);
  --scrim: rgba(20, 28, 60, .28);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r: 26px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05070f; --ink: #f4f6ff; --ink2: rgba(244, 246, 255, .68); --ink3: rgba(244, 246, 255, .42);
    --glass: rgba(255, 255, 255, .075); --glass2: rgba(40, 46, 70, .72); --field: rgba(255, 255, 255, .09);
    --edge: rgba(255, 255, 255, .16); --spec: rgba(255, 255, 255, .22); --hair: rgba(255, 255, 255, .10);
    --accent: #3d9bff; --u0: #3d9bff; --u1: #ff4f86; --good: #34d47a; --warn: #ffa733; --bad: #ff5a5f;
    --blob1: #0f4fb8; --blob2: #7d1750; --blob3: #4b2ab0; --blob4: #0b6b70;
    --shadow: 0 12px 40px rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05070f; --ink: #f4f6ff; --ink2: rgba(244, 246, 255, .68); --ink3: rgba(244, 246, 255, .42);
  --glass: rgba(255, 255, 255, .075); --glass2: rgba(40, 46, 70, .72); --field: rgba(255, 255, 255, .09);
  --edge: rgba(255, 255, 255, .16); --spec: rgba(255, 255, 255, .22); --hair: rgba(255, 255, 255, .10);
  --accent: #3d9bff; --u0: #3d9bff; --u1: #ff4f86; --good: #34d47a; --warn: #ffa733; --bad: #ff5a5f;
  --blob1: #0f4fb8; --blob2: #7d1750; --blob3: #4b2ab0; --blob4: #0b6b70;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent); text-decoration: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* fond */
#bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; background: var(--bg); }
#bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .85; animation: drift 26s ease-in-out infinite alternate; }
#bg i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -25vmax; background: var(--blob1); }
#bg i:nth-child(2) { width: 60vmax; height: 60vmax; right: -25vmax; top: 10vmax; background: var(--blob2); animation-duration: 32s; animation-direction: alternate-reverse; }
#bg i:nth-child(3) { width: 65vmax; height: 65vmax; left: -10vmax; bottom: -30vmax; background: var(--blob3); animation-duration: 38s; }
#bg i:nth-child(4) { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -10vmax; background: var(--blob4); animation-duration: 30s; animation-direction: alternate-reverse; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(6vmax, 5vmax, 0) scale(1.15); } }
@media (prefers-reduced-motion: reduce) { #bg i { animation: none; } * { transition: none !important; animation-duration: .01s !important; } }

#app { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; min-height: 100%; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 118px); display: flex; flex-direction: column; gap: 14px; }

/* boutons, puces */

/* listes */

.inp { -webkit-touch-callout: default; }

.moodcell { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--field); border: 1px solid var(--edge); text-align: left; min-width: 0; }

.tbars { display: flex; align-items: flex-end; gap: 3px; height: 100%; }
.tbars i { flex: 1; min-width: 2px; border-radius: 3px 3px 1px 1px; background: var(--ink2); }

.ibtn { font-size: 22px; font-weight: 600; }

.snapgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.snapf.locked { background: linear-gradient(145deg, color-mix(in srgb, var(--blob2) 45%, var(--field)), color-mix(in srgb, var(--blob3) 45%, var(--field))); }

.snaptag { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: #fff; background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* plus */

.tile:active { transform: scale(.94); }

/* photos */

.wheelbox::after { content: ""; position: absolute; left: 50%; top: -8px; margin-left: -11px; border: 11px solid transparent; border-top: 20px solid var(--ink); filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .3)); }

/* compte à rebours */
.cd { display: flex; align-items: center; gap: 14px; }
.cd .j { font: 750 26px/1 var(--display); letter-spacing: -.02em; min-width: 76px; text-align: center; padding: 12px 6px; border-radius: 18px; background: var(--field); border: 1px solid var(--edge); font-variant-numeric: tabular-nums; }

/* connexion */
.login { margin: auto 0; padding: 28px 22px; gap: 16px; }
.logo { font: 800 54px/1 var(--display); letter-spacing: -.05em; background: linear-gradient(120deg, var(--u0), var(--u1)); -webkit-background-clip: text; background-clip: text; color: transparent; }

#toast { position: fixed; z-index: 90; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -160%); transition: transform .35s cubic-bezier(.2, .9, .25, 1); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14.5px; max-width: calc(100% - 32px); text-align: center; background: var(--glass2); }

/* ----- composition : photo arrière plein cadre, selfie en médaillon ----- */
async function composeSnap(back, front) {
  const W = S.demo ? 600 : 1080, H = Math.round(W * 4 / 3);

  const demoAns = (d, who, text) => { const q = qOf(d); add('answers', { id: d + '_' + who, date: d, user: who, text: q.t === 'who' ? (who === M ? G : M) : q.t === 'choice' ? (who === M ? 'a' : 'b') : text }, who, 2); };
  const y = addDays(t, -1);
  demoAns(y, M, 'Notre week-end à Biarritz, sans hésiter.'); demoAns(y, G, 'Le pique-nique improvisé sur les quais.');
  demoAns(t, G, 'Une réponse qui t\'attend…');
  // listes, dossiers, roue
  for (const [id, name, emoji] of [['l_courses', 'Courses', '🛒'], ['l_restos', 'Restos à tester', '🍜'], ['l_films', 'Films et séries', '🎬'], ['l_sorties', 'Idées de sorties', '🎡']]) add('lists', { id, name, emoji });
  [['l_courses', 'Lait d\'avoine'], ['l_courses', 'Parmesan'], ['l_courses', 'Café', true], ['l_restos', 'Le ramen de la rue Sainte-Anne'], ['l_restos', 'La trattoria du coin'], ['l_restos', 'Le bistrot étoilé pour une grande occasion'], ['l_sorties', 'Balade à vélo le long du canal'], ['l_sorties', 'Soirée jeux de société'], ['l_films', 'Finir la série du dimanche soir'], ['l_sorties', 'Expo à la Bourse de Commerce']].forEach(([list, text, done], i) => add('items', { list, text, done: !!done, lvl: /ramen|trattoria|jeux/.test(text) ? 1 : /étoilé/.test(text) ? 3 : /Expo/.test(text) ? 2 : 0 }, i % 2 ? G : M, i));
  for (const [id, name, emoji] of [['d_loc', 'Dossier locataire', '🔑'], ['d_admin', 'Administratif', '🗂️'], ['d_voy', 'Voyages', '✈️']]) add('folders', { id, name, emoji });
  ['Italien', 'Japonais', 'Burger', 'Thaï', 'Libanais', 'Crêpes', 'Pizza', 'On cuisine'].forEach((x, i) => add('wheel', { id: 'w_' + i, text: x }, M, -i));
  // envies
  add('wishes', { owner: M, text: 'Un casque audio', price: 150, reservedBy: G });
  add('wishes', { owner: M, text: 'Le dernier thriller de la rentrée' });
  add('wishes', { owner: G, text: 'Un cours de poterie', price: 60 }, G);
  add('wishes', { owner: G, text: 'Un week-end à la mer' }, G);
  // comptes à rebours
  const yr = +t.slice(0, 4), noel = `${t > yr + '-12-25' ? yr + 1 : yr}-12-25`;
  add('countdowns', { title: 'Noël', date: noel, emoji: '🎄' });
  add('countdowns', { title: 'Week-end à deux', date: addDays(t, 23), emoji: '🧳' }, G);
  // photos
  [['🌊', '#7fc8ff', '#ffe1a8', 'Biarritz', 40], ['🍝', '#ffb3a8', '#ffd98f', 'Le resto du samedi', 12], ['🌇', '#ffa9cc', '#8f9bff', 'Coucher de soleil sur les quais', 5], ['🎶', '#c4b0ff', '#ff9fc6', 'Avant le concert', 2]]
    .forEach(([e, a, b, caption, ago]) => add('photos', { fileId: pic(e, a, b), caption, date: addDays(t, -ago) }, ago % 2 ? G : M, ago * 24));
  return { cols, files };
};
