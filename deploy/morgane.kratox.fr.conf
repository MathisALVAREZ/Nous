# /etc/nginx/sites-available/morgane.kratox.fr
server {
    listen 80;
    listen [::]:80;
    server_name morgane.kratox.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name morgane.kratox.fr;

    # Certificats posés par certbot (voir install.sh)
    ssl_certificate     /etc/letsencrypt/live/morgane.kratox.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/morgane.kratox.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
