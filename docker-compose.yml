# Une instance par couple : INSTANCE, PORT_LOCAL et DOMAIN viennent du fichier .env du dossier.
services:
  nous:
    build: .
    container_name: ${INSTANCE:-nous}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT_LOCAL:-3080}:3000"   # joignable uniquement depuis le VPS
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
